syntax="proto3";

message rawImageMsg {
    bytes img=1;
}
message addMsg {
  int32 a = 1;
  int32 b = 2;
}
message dotProductMsg {
    repeated float a = 1;
    repeated float b = 2;
  }
message jsonImageMsg {
      string img=1;
  }

message addReply {
    int32 sum = 1;
}
message dotProductReply {
    float dotproduct = 1;
}
message imageReply {
    int32 width=1;
    int32 height=2;
}

service raw {
    rpc raw(rawImageMsg) returns (imageReply) {}
}
service add {
    rpc add(addMsg) returns (addReply) {}
}
service dot {
    rpc dot(dotProductMsg) returns (dotProductReply) {}
}
service jsonimg {
    rpc jsonimg(jsonImageMsg) returns (imageReply) {}
}